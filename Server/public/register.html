<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Siswa - LabShield Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="auth-layout">
        <div class="panel auth-card">
            <span class="brand-mark">LabShield Protocol</span>
            <h1 class="auth-title">Registrasi Siswa</h1>
            <p class="auth-subtitle">Daftarkan akun agar bisa login dari game dan melihat dashboard hasil.</p>

            <form id="registerForm" onsubmit="event.preventDefault(); register();">
                <div class="form-row">
                    <label for="username">Username</label>
                    <input id="username" class="input" type="text" required placeholder="misal: siswa_kimia_1">
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" class="input" type="password" required minlength="4" placeholder="Minimal 4 karakter">
                </div>
                <button id="registerBtn" type="submit" class="btn btn-main">Buat Akun</button>
            </form>

            <div id="message" class="message"></div>
            <a href="index.html" class="link-muted">Kembali ke Home</a>
        </div>
    </section>

    <script>
        async function register() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const msg = document.getElementById('message');
            const btn = document.getElementById('registerBtn');

            msg.className = 'message';
            msg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Registrasi gagal.');
                }

                msg.textContent = data.message || 'Registrasi berhasil.';
                msg.className = 'message success active';
                document.getElementById('registerForm').reset();
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 1200);
            } catch (error) {
                msg.textContent = error.message || 'Connection Error';
                msg.className = 'message error active';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Buat Akun';
            }
        }
    </script>
</body>
</html>
