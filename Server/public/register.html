<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Siswa - LabShield Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="auth-layout">
        <div class="panel auth-card">
            <span class="brand-mark">LabShield Protocol</span>
            <h1 class="auth-title">Registrasi Siswa</h1>
            <p class="auth-subtitle">Daftarkan akun dengan email terverifikasi OTP agar registrasi lebih aman.</p>

            <form id="registerForm" onsubmit="event.preventDefault(); register();">
                <div class="form-row">
                    <label for="email">Email</label>
                    <input id="email" class="input" type="email" required placeholder="misal: siswa@email.com">
                </div>
                <div class="form-row" style="display:flex; gap:8px; align-items:flex-end;">
                    <div style="flex:1;">
                        <label for="otp">Kode OTP</label>
                        <input id="otp" class="input" type="text" required maxlength="6" minlength="6" placeholder="6 digit OTP">
                    </div>
                    <button id="sendOtpBtn" type="button" class="btn btn-soft" onclick="requestOtp()" style="width:auto; min-width:140px;">
                        Kirim OTP
                    </button>
                </div>
                <div class="form-row">
                    <label for="username">Username</label>
                    <input id="username" class="input" type="text" required placeholder="misal: siswa_kimia_1">
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" class="input" type="password" required minlength="4" placeholder="Minimal 4 karakter">
                </div>
                <button id="registerBtn" type="submit" class="btn btn-main">Buat Akun</button>
            </form>

            <div id="message" class="message"></div>
            <a href="index.html" class="link-muted">Kembali ke Home</a>
        </div>
    </section>

    <script>
        let otpCooldown = null;
        let cooldownSeconds = 0;

        function setMessage(type, text) {
            const msg = document.getElementById('message');
            msg.textContent = text || '';
            msg.className = text ? `message ${type} active` : 'message';
        }

        function setOtpButtonState(disabled, label) {
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = disabled;
            if (label) btn.textContent = label;
        }

        function startCooldown(seconds) {
            const btn = document.getElementById('sendOtpBtn');
            cooldownSeconds = seconds;
            setOtpButtonState(true, `Kirim Ulang (${cooldownSeconds}s)`);

            if (otpCooldown) clearInterval(otpCooldown);
            otpCooldown = setInterval(() => {
                cooldownSeconds -= 1;
                if (cooldownSeconds <= 0) {
                    clearInterval(otpCooldown);
                    otpCooldown = null;
                    setOtpButtonState(false, 'Kirim OTP');
                } else {
                    btn.textContent = `Kirim Ulang (${cooldownSeconds}s)`;
                }
            }, 1000);
        }

        async function requestOtp() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                setMessage('error', 'Isi email terlebih dahulu.');
                return;
            }

            setMessage('', '');
            setOtpButtonState(true, 'Mengirim...');

            try {
                const res = await fetch('/api/register/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Gagal mengirim OTP.');
                }

                setMessage('success', data.message || 'OTP berhasil dikirim.');
                startCooldown(60);
            } catch (error) {
                setMessage('error', error.message || 'Connection Error');
                setOtpButtonState(false, 'Kirim OTP');
            }
        }

        async function register() {
            const e = document.getElementById('email').value.trim();
            const o = document.getElementById('otp').value.trim();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const btn = document.getElementById('registerBtn');

            setMessage('', '');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: e, otp: o, username: u, password: p })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Registrasi gagal.');
                }

                setMessage('success', data.message || 'Registrasi berhasil.');
                document.getElementById('registerForm').reset();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } catch (error) {
                setMessage('error', error.message || 'Connection Error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Buat Akun';
            }
        }
    </script>
</body>
</html>
